_target_: gpatch_v4.configs.config.RlConfig

training:
  training_backend: mcore
  use_gen_rm_reward: False
  use_bt_rm_reward: True
  use_fast_tokenizer: True
  rollout_gbs: 128
  rollout_mbs: 1
  sampling_repeat_n: 5
  sampling_keep_n: 5
  train_gbs: 640
  seq_length: 3072
  data_parallel_random_init: False
  save_interval: 100
  auto_load_from_save_ckpt: True
  build_from_mbridge: True
  num_train_epoches: 15
  ppo_max_epochs_2: 2
  moe_pad_with_random_tokens: True
  freeze_moe_router: True
  freeze_vit: True
  freeze_projector: True
  metrics_report:
    - "acc_reward"
    - "fmt_reward"

checkpoint:
  load_ckpt_path: ckpt_qwen3_6_35b_grpo_rule_only
  save_ckpt_path: ckpt_qwen3_6_35b_grpo_rule_only
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 1.0e-6
  lr_warmup_steps: 0
  lr_decay_style: "constant"
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "hf-hub/hiyouga/geometry3k"
  py_path: "tasks/multimodal_v4/grpo/qwen3vl_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  dataloader_num_workers: 4
  dataloader_pin_memory: True
  dataloader_prefetch_factor: 32
  # only for verify dataloader in gpatch_v4/entry/verify_dataloader.py
  dataloader_verify_fn_name: "verify_dataloader_func"

policy:
  dist_config:
    nnodes: -1
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 2
    expert_model_parallel_size: 4
    expert_tensor_parallel_size: 1
    context_parallel_size: 1
  model_arch: "qwen3_5_moe"
  hf_model_path: "hf-hub/Qwen/Qwen3.6-35B-A3B/"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen3.6-35B-A3B/"
  ref_hf_model_path: "hf-hub/Qwen/Qwen3.6-35B-A3B/"
  forward_only_mbs: 1
  rollout_gen_type: "base"
  sampler_client:
    rpc_type: ray
  gen_rm_client:
    rpc_type: ray
  bt_rm_client:
    rpc_type: ray
  override_transformer_config:
    variable_seq_lengths: False
    moe_router_load_balancing_type: "none"
    moe_aux_loss_coeff: 0.0
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1

sampler:
  backend: sglang
  dist_config:
    nnodes: -1
  model_info:
    - model_arch: "qwen3_5_moe"
      hf_model_path: "hf-hub/Qwen/Qwen3.6-35B-A3B/"

  infer_engine_configs:
    - dist_config:
        nnodes: -1
        tensor_model_parallel_size: 4
        expert_model_parallel_size: 2
      use_fast_tokenizer: True
      gpu_memory_utilization: 0.6
      max_running_requests: 64
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 1.5
      repetition_penalty: 1.0
      generate_max_tokens: 2048

bt_rm:
  dist_config:
    nnodes: -1
  reward_type: "rule_only"
  reward_model_info:
    - model_arch: "qwen3_5_moe"
      hf_model_path: "hf-hub/Qwen/Qwen3.6-35B-A3B/"
      reward_py_path: tasks/multimodal_v4/grpo/rule_reward.py
      parse_reward_fn_name: geo3k_rl_rule_reward
      reward_weight: 1.0
  infer_engine_configs:
    - dist_config:
        nnodes: -1

ppo:
  advantage_type: "grpo"
  grpo_advantage_epsilon: 1.0e-4
  ppo_ratio_eps: 0.2
  grpo_kl_loss_beta: 0.01
  ppo_dual_clip_ratio_c: 1.2
  ppo_clamp_kl_val: 20

debug:
  save_first_rollout_data: True
  debug_engine_update_weight: False
