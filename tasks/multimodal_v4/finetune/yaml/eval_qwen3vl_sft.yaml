_target_: gpatch_v4.configs.config.EvaluateConfig

training:
  seq_length: 8192
  train_mbs: 1
  use_fast_tokenizer: True
  eval_sampling_repeat_n: 1

data:
  data_pathes:
    - "/tmp/filter_4k_pmc_vqa_gdataset_v4_eval.json"
  py_path: "tasks/multimodal_v4/finetune/qwen3vl_sft_eval_gen.py"
  fn_name: "get_eval_dataset_and_dataloader"
  dataloader_num_workers: 4
  dataloader_pin_memory: True

policy:
  dist_config:
    nnodes: -1
  model_arch: "qwen3_vl"
  hf_model_path: "ckpt_qwen3_vl_4b_pmc_vqa_dyn_cp/hf/595"
  hf_tokenizer_path: "ckpt_qwen3_vl_4b_pmc_vqa_dyn_cp/hf/595"
  sampler_client:
    rpc_type: ray

sampler:
  backend: sglang
  sampler_type: "sampler"
  dist_config:
    nnodes: -1
  model_info:
    - model_arch: "qwen3_vl"
      hf_model_path: "ckpt_qwen3_vl_4b_pmc_vqa_dyn_cp/hf/595"
      gen_rollout_py_path: "tasks/multimodal_v4/finetune/qwen3vl_sft_eval_gen.py"
      gen_rollout_fn_name: "offline_generate_func"

  infer_engine_configs:
    - dist_config:
        nnodes: -1
        tensor_model_parallel_size: 2
      gpu_memory_utilization: 0.7
      max_running_requests: 128
      mm_per_request_timeout: 100
      temperature: 0.0
      top_k: 1
      top_p: 1.0
      generate_max_tokens: 2048
      use_fast_tokenizer: True

evaluate_result:
  output_dir: "eval_output"
  output_prefix: "sft_eval"
  evaluate_py_path: "tasks/multimodal_v4/finetune/qwen3vl_sft_eval_gen.py"
  evaluate_fn_name: "eval_rollout_samples"

task:
  dataset_key: "test"
