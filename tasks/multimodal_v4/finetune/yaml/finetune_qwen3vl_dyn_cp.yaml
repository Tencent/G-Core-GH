# @package _global_
_target_: gpatch_v4.configs.config.FinetuneConfig

training:
  training_backend: mcore
  use_fast_tokenizer: True
  train_gbs: 256
  train_mbs: 1
  seq_length: 4096
  data_parallel_random_init: False
  save_interval: 100
  num_train_epoches: 1
  comput_attn_mask: False
  sort_batched: False
  auto_load_from_save_ckpt: True
  build_from_mbridge: True
  attention_backend: flash

checkpoint:
  load_ckpt_path: ckpt_qwen3_vl_4b_pmc_vqa_dyn_cp
  save_ckpt_path: ckpt_qwen3_vl_4b_pmc_vqa_dyn_cp
  save_total_limit: 5
  save_retain_interval: 5000
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 5.0e-7
  lr_warmup_steps: 0
  lr_decay_style: "constant"
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "/tmp/filter_4k_pmc_vqa_gdataset_v4.json"
    - "/tmp/filter_4k_pmc_vqa_gdataset_v4_eval.json"
  py_path: "tasks/multimodal_v4/finetune/qwen3vl_sft_v4.py"
  fn_name: "get_dataset_and_dataloader"
  dataloader_num_workers: 8
  dataloader_pin_memory: True
  dataloader_verify_fn_name: "verify_dataloader_func"

policy:
  dist_config:
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 2
    dynamic_context_parallel: True
    max_seqlen_per_dp_cp_rank: 2048
    min_dynamic_context_parallel_size: 1
  model_arch: "qwen3_vl"
  without_ref: True
  hf_model_path: "hf-hub/Qwen/Qwen3-VL-4B-Instruct"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen3-VL-4B-Instruct"
  override_transformer_config:
    calculate_per_token_loss: true

debug:
  save_first_rollout_data: True

task:
  shuffle_buffer_size: 102400
  smart_padding_buffer_size: 2048
