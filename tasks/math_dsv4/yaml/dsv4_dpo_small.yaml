_target_: gpatch_v4.configs.config.DpoConfig

training:
  training_backend: fsdp2
  use_fast_tokenizer: True
  train_gbs: 64
  # train_mbs 是取数据的 mbs，一个 dpo 样本产出 chosen + rejected 两条数据，
  # 所以实际 microbatch size = train_mbs * 2。
  train_mbs: 1
  seq_length: 8192
  data_parallel_random_init: False
  save_interval: 400
  num_train_epoches: 10
  comput_attn_mask: False
  sort_batched: False
  build_from_mbridge: True
  auto_load_from_save_ckpt: True
  use_dynamic_mbs: False
  recompute: True
  loss_func: dpo
  dpo_beta: 0.1
  dpo_label_smoothing: 0.0
  dpo_loss_type: sigmoid
  dpo_ftx_gamma: 0.0

checkpoint:
  load_ckpt_path: save_dsv4_dpo
  save_ckpt_path: save_dsv4_dpo
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True
  override_tokenizer_special_token:
    eos_token: "<｜end▁of▁sentence｜>"

optimizer:
  lr: 1.0e-6
  lr_warmup_steps: 0
  lr_decay_style: "constant"
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

# data:
#   data_pathes:
#     - "/mnt/ceph-hz1-csp/mm-base-plt2/user_xiaotaoliu/data/dqa-dpo/"
