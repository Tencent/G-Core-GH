data:
  data_pathes:
    - "/mnt/ceph-hz1-csp/mm-base-plt2/user_xiaotaoliu/data/dpo_data2/"
  py_path: "tasks/math_dsv4/dpo_dataset_v2.py"
  fn_name: "get_dataset_and_dataloader"
  dataloader_num_workers: 1
  dataloader_pin_memory: True

policy:
  dist_config:
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 4
    context_parallel_size: 1
  model_arch: "deepseek_v4"
  attn_implementation: "fused"
  indexer_backend: "fused"
  without_ref: False
  hf_model_path: "hf-hub/deepseek-ai/DeepSeek-V4-Flash_small"
  hf_tokenizer_path: "hf-hub/deepseek-ai/DeepSeek-V4-Flash_small"
  ref_hf_model_path: "hf-hub/deepseek-ai/DeepSeek-V4-Flash_small"

debug:
  save_first_rollout_data: true
