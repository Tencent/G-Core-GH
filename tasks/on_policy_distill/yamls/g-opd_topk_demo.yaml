# @package _global_

training:
  training_backend: mcore
  use_gen_rm_reward: False
  use_bt_rm_reward: False
  use_fast_tokenizer: True
  rollout_gbs: 512
  rollout_mbs: 1
  sampling_repeat_n: 1
  sampling_keep_n: 1
  train_gbs: 512
  seq_length: 16384
  data_parallel_random_init: False
  save_interval: 4000
  metrics_report:
    - "acc_reward"
    - "fmt_reward"
  auto_load_from_save_ckpt: True
  num_train_epoches: 3

checkpoint:
  load_ckpt_path: load_g_opd_ckpt_demo
  save_ckpt_path: save_g_opd_ckpt_demo
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 1.0e-6
  lr_warmup_step_frac: 0.1
  lr_decay_style: "constant"
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "hf-hub/openai/gsm8k-jsonl/train"
  py_path: "tasks/on_policy_distill/g_opd_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  system_prompt: "Please reason step by step, keep your reasoning as short as possible, and put your final answer within \\boxed{}."
  dataloader_num_workers: 1
  dataloader_pin_memory: True

policy:
  dist_config:
    nnodes: -1
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
  model_arch: "qwen3"
  hf_model_path: "save_sft_ckpt_debug_train_base/hf/3357"
  hf_tokenizer_path: "save_sft_ckpt_debug_train_base/hf/3357"
  ref_hf_model_path: "save_sft_ckpt_debug_train_base/hf/3357"
  rollout_gen_type: "on_policy_distill"
  sampler_client:
    rpc_type: ray
  teacher_client:
    rpc_type: ray
  gen_rm_client:
    rpc_type: ray
  bt_rm_client:
    rpc_type: ray

sampler:
  backend: sglang
  dist_config:
    nnodes: -1
  model_info:
    - model_arch: "qwen3"
      hf_model_path: "save_sft_ckpt_debug_train_base/hf/3357"

  infer_engine_configs:
    - dist_config:
        nnodes: -1
        tensor_model_parallel_size: 2
      gpu_memory_utilization: 0.7
      max_running_requests: 128
      temperature: 1.0
      top_p: 1.0
      generate_max_tokens: 14336
      use_fast_tokenizer: True

teachers:
  big_teacher:
    dist_config:
      nnodes: 1
      tensor_model_parallel_size: 2
      pipeline_model_parallel_size: 1
    model_arch: "qwen3"
    hf_model_path: "hf-hub/Qwen/Qwen3-8B"
    hf_tokenizer_path: "hf-hub/Qwen/Qwen3-8B"
    wrap_with_ddp: False
  small_teacher:
    dist_config:
      nnodes: 1
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
    model_arch: "qwen3"
    hf_model_path: "hf-hub/Qwen/Qwen3-4B-Instruct-2507"
    hf_tokenizer_path: "hf-hub/Qwen/Qwen3-4B-Instruct-2507"
    wrap_with_ddp: False

ppo:
  advantage_type: "g_opd"
  loss_func: "opd"
  log_prob_top_k: 32
  ppo_ratio_eps: 0.2
  ppo_clip_ratio_low: 0.003
  ppo_clip_ratio_high: 0.004
  ppo_dual_clip_ratio_c: 3.0
  ppo_logps_ratio_clamp: 20.0
  grpo_kl_loss_beta: 1.0e-3
  opd_teacher_kl_loss_beta: 1.0e-2
  ppo_entropy_bonus: 0.0
  enable_off_policy_correction: True
  off_policy_correction_level: "token"
  off_policy_correction_mode: "truncate"
  off_policy_correction_upper_bound: 5.0
  g_opd_lambda: 1.25
  g_opd_use_base_model: True
  g_opd_mix_reward_advantage: False
  g_opd_teacher_routing_field: "teacher_type"

debug:
  save_first_rollout_data: True
  debug_engine_update_weight: False
