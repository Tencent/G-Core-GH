# @package _global_

training:
  training_backend: mcore
  use_gen_rm_reward: False
  use_bt_rm_reward: True
  use_fast_tokenizer: True
  rollout_gbs: 32
  rollout_mbs: 1
  sampling_repeat_n: 8
  sampling_keep_n: 8
  train_gbs: 256
  seq_length: 16384
  data_parallel_random_init: False
  save_interval: 100
  metrics_report:
    - "acc_reward"
    - "fmt_reward"
  auto_load_from_save_ckpt: True
  num_train_epoches: 10

checkpoint:
  load_ckpt_path: load_onp_distill_qwen3_1.7b_base_after_sft
  save_ckpt_path: save_onp_distill_qwen3_1.7b_base_after_sft
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 1.0e-6
  lr_warmup_steps: 50
  lr_decay_style: "constant"
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "hf-hub/openai/gsm8k-jsonl/train"
  py_path: "tasks/on_policy_distill/simple_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  system_prompt: "Please reason step by step, keep your reasoning as short as possible, and put your final answer within \\boxed{}."
  dataloader_num_workers: 1
  dataloader_pin_memory: True

policy:
  dist_config:
    nnodes: -1
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
  model_arch: "qwen3"
  hf_model_path: "save_sft_ckpt_debug_train_base/hf/3357"
  hf_tokenizer_path: "save_sft_ckpt_debug_train_base/hf/3357"
  ref_hf_model_path: "save_sft_ckpt_debug_train_base/hf/3357"
  rollout_gen_type: "on_policy_distill"
  sampler_client:
    rpc_type: ray
  teacher_client:
    rpc_type: ray
  gen_rm_client:
    rpc_type: ray
  bt_rm_client:
    rpc_type: ray

sampler:
  backend: sglang
  dist_config:
    nnodes: -1
  model_info:
    - model_arch: "qwen3"
      hf_model_path: "save_sft_ckpt_debug_train_base/hf/3357"

  infer_engine_configs:
    - dist_config:
        nnodes: -1
        tensor_model_parallel_size: 2
      gpu_memory_utilization: 0.7
      max_running_requests: 128
      temperature: 1.0
      top_p: 0.9
      generate_max_tokens: 14336
      use_fast_tokenizer: True

teacher:
  dist_config:
    nnodes: -1
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
  model_arch: "qwen3"
  hf_model_path: "hf-hub/Qwen/Qwen3-1.7B"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen3-1.7B"
  wrap_with_ddp: False

bt_rm:
  dist_config:
    nnodes: -1
  reward_type: "rule_only"
  reward_model_info:
    - model_arch: "qwen3"
      hf_model_path: "save_sft_ckpt_debug_train_base/hf/3357"
      reward_py_path: tasks/on_policy_distill/bt_reward.py
      parse_reward_fn_name: math_rl_rule_reward
      reward_weight: 1.0
  infer_engine_configs:
    - dist_config:
        nnodes: -1

ppo:
  advantage_type: "on_policy_distill"
  loss_func: "opd"
  distill_kl_penalty_coef: 1.0
  distill_kl_discount_factor: 0.0
  ppo_ratio_eps: 0.2
  grpo_kl_loss_beta: 0.0
  ppo_entropy_bonus: 0.0

debug:
  save_first_rollout_data: True
  debug_engine_update_weight: False
