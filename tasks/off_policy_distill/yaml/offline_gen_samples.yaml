training:
  seq_length: 16384
  train_mbs: 1
  use_fast_tokenizer: True

data:
  data_pathes:
    - "hf-hub/AI-MO/NuminaMath-CoT-jsonl/train_sub"
  py_path: "tasks/off_policy_distill/simple_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  system_prompt: "Please reason step by step, keep your reasoning as short as possible, and put your final answer within \\boxed{}."
  dataloader_num_workers: 1
  dataloader_pin_memory: True

policy:
  dist_config:
    nnodes: 8
  model_arch: "qwen3"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen3-32B/"
  sampler_client:
    rpc_type: ray

sampler:
  backend: sglang
  sampler_type: "sampler"
  dist_config:
    nnodes: 8
  model_info:
    - model_arch: "qwen3"
      hf_model_path: "hf-hub/Qwen/Qwen3-32B/"
      gen_rollout_py_path: "tasks/off_policy_distill/offline_generate_examples.py"
      gen_rollout_fn_name: "offline_generate_func"

  infer_engine_configs:
    - dist_config:
        nnodes: 8
        tensor_model_parallel_size: 4
      gpu_memory_utilization: 0.8
      max_running_requests: 128
      temperature: 1.0
      top_p: 0.9
      generate_max_tokens: 14336
      use_fast_tokenizer: True

evaluate_result:
  output_dir: "offline_gen_dataset"
  output_prefix: "qwen3_32B_gen_samples"
  evaluate_py_path: tasks/off_policy_distill/offline_generate_examples.py
  evaluate_fn_name: save_rollout_samples
