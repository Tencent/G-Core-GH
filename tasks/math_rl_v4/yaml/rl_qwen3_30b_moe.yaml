# @package _global_
_target_: gpatch_v4.configs.config.RlConfig

placement_type: "colocate"

training:
  training_backend: mcore
  use_gen_rm_reward: False
  use_bt_rm_reward: True
  use_fast_tokenizer: True
  # With 4 nodes, TP=4, PP=2 -> policy DP = 4.
  # Sampler TP=4 -> 8 replicas. Keep gbs a multiple of lcm(DP, replicas)=8.
  rollout_gbs: 32
  rollout_mbs: 1
  sampling_repeat_n: 1
  sampling_keep_n: 1
  train_gbs: 32
  train_mbs: 1
  data_parallel_random_init: False
  save_interval: 10000
  eval_interval: 10000
  eval_before_train: False
  build_from_mbridge: True
  num_train_epoches: 1
  ppo_max_epochs_2: 1
  metrics_report:
    - "acc_reward"
    - "fmt_reward"
  apply_deterministic_mode: True

checkpoint:
  load_ckpt_path: ckpt_smoke_sglang_wt_qwen3_30b_moe
  save_ckpt_path: ckpt_smoke_sglang_wt_qwen3_30b_moe
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 5.0e-7
  lr_warmup_steps: 2
  lr_decay_style: "cosine"
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "hf-hub/openai/gsm8k-jsonl/train"
  eval_data_pathes:
    - "hf-hub/openai/gsm8k-jsonl/eval"
  py_path: "tasks/math_rl_v4/simple_dataset.py"
  system_prompt: "Please reason step by step, keep your reasoning as short as possible, and put your final answer within \\boxed{}."
  fn_name: "get_dataset_and_dataloader"
  dataloader_num_workers: 1
  dataloader_pin_memory: True

policy:
  dist_config:
    nnodes: -1
    tensor_model_parallel_size: 4
    expert_model_parallel_size: 4
    pipeline_model_parallel_size: 2
    expert_tensor_parallel_size: 1
  model_arch: "qwen3_moe"
  hf_model_path: "hf-hub/Qwen/Qwen3-30B-A3B"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen3-30B-A3B"
  ref_hf_model_path: "hf-hub/Qwen/Qwen3-30B-A3B"
  sampler_client:
    rpc_type: ray
    update_weight_max_size_mb: 512
  gen_rm_client:
    rpc_type: ray
  bt_rm_client:
    rpc_type: ray
  override_transformer_config:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1

sampler:
  backend: sglang
  dist_config:
    nnodes: -1
  model_info:
    - model_arch: "qwen3_moe"
      hf_model_path: "hf-hub/Qwen/Qwen3-30B-A3B"
  infer_engine_configs:
    - dist_config:
        nnodes: -1
        tensor_model_parallel_size: 8
      use_fast_tokenizer: True
      gpu_memory_utilization: 0.8
      max_running_requests: 64
      temperature: 1.0
      top_p: 0.9
      generate_max_tokens: 512

bt_rm:
  dist_config:
    nnodes: -1
  reward_type: "rule_only"
  reward_model_info:
    - model_arch: "qwen3_moe"
      hf_model_path: "hf-hub/Qwen/Qwen3-30B-A3B"
      reward_py_path: tasks/math_rl_v4/bt_reward.py
      parse_reward_fn_name: math_rl_rule_reward
      reward_weight: 1.0
  infer_engine_configs:
    - dist_config:
        nnodes: -1

ppo:
  advantage_type: "grpo"
  grpo_advantage_epsilon: 1.0e-4
  ppo_ratio_eps: 0.2

debug:
  debug_engine_update_weight: True
  debug_engine_save_path: "examples/xiaotaoliu/sglang_weight_transfer/debug_weights_qwen3_30b_moe"
