# @package _global_
# FIPO (Future-KL Influenced Policy Optimization) training config
# Based on rl_config.yaml with loss_func set to "fipo"
# ref: https://arxiv.org/abs/2603.19835

training:
  training_backend: mcore
  use_gen_rm_reward: False
  use_bt_rm_reward: True
  use_fast_tokenizer: True
  rollout_gbs: 256
  rollout_mbs: 1
  sampling_repeat_n: 32
  sampling_keep_n: 32
  train_gbs: 256
  pad_to_mulitiple_of: 1024
  train_mbs: 1
  data_parallel_random_init: False
  save_interval: 100
  build_from_mbridge: True
  num_train_epoches: 2
  ppo_max_epochs_2: 2
  metrics_report:
    - "acc_reward"
    - "fmt_reward"

checkpoint:
  load_ckpt_path: save_qwen_2_5_1_5b_fipo
  save_ckpt_path: save_qwen_2_5_1_5b_fipo
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 5.0e-7
  lr_warmup_steps: 2
  lr_decay_style: "cosine"
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "hf-hub/openai/gsm8k-jsonl/train"
  py_path: "tasks/math_rl_v4/simple_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  system_prompt: "Please reason step by step, keep your reasoning as short as possible, and put your final answer within \\boxed{}."
  dataloader_num_workers: 1
  dataloader_pin_memory: True

policy:
  dist_config:
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
  model_arch: qwen2
  hf_model_path: "sft_convert/hf/3357/"
  hf_tokenizer_path: "sft_convert/hf/3357/"
  ref_hf_model_path: "sft_convert/hf/3357/"
  sampler_client:
    rpc_type: ray
  gen_rm_client:
    rpc_type: ray
  bt_rm_client:
    rpc_type: ray
  balance_dp_seqlen: True
  smart_pad_infer: True
  smart_pad_train: True
  dynamic_mbs_target_seqlen_fwd_only: 8192
  dynamic_mbs_limit_fwd_only: 16
  dynamic_mbs_target_seqlen: 4096
  dynamic_mbs_limit: 16

sampler:
  backend: sglang
  model_info:
    - model_arch: qwen2
      hf_model_path: "sft_convert/hf/3357/"

  infer_engine_configs:
    - dist_config:
        tensor_model_parallel_size: 1
      use_fast_tokenizer: True
      gpu_memory_utilization: 0.7
      max_running_requests: 128
      temperature: 1.0
      top_p: 0.9
      generate_max_tokens: 2048

bt_rm:
  reward_type: "rule_only"
  reward_model_info:
    - model_arch: "qwen2.5-math-rm-72b"
      hf_model_path: "hf-hub/Qwen/Qwen2.5-Math-RM-72B/"
      reward_py_path: tasks/math_rl_v4/bt_reward.py
      parse_reward_fn_name: math_rl_rule_reward
      reward_weight: 1.0
  infer_engine_configs:
    - dist_config:
        nnodes: -1

# dist_config.nnodes 设置 -1 表示适用所有节点

ppo:
  loss_func: "fipo"
  grpo_advantage_epsilon: 1.0e-4
  grpo_kl_loss_beta: 0.0
  ppo_logps_ratio_clamp: 20.0
  ppo_ratio_eps: 0.2
  # Dual-clip PPO for negative-advantage filtering (required by FIPO sequence filter)
  ppo_dual_clip_ratio_c: 10.0
  ppo_clip_ratio_low: 0.2
  ppo_clip_ratio_high: 0.28
  # FIPO-specific parameters
  fipo_decay_rate: 32.0         # τ, γ = 2^(-1/τ), controls Future-KL decay speed
  fipo_chunk_size: 128          # chunked matmul block size for Future-KL
  fipo_clip_ratio: 0.2          # influence weight clipping range
  fipo_clip_high_only: true     # asymmetric clip [1.0, 1+ratio]
  fipo_safety_thresh: 10.0      # safety threshold for neg-adv high-IS tokens

debug:
  save_first_rollout_data: True
  debug_engine_update_weight: False
