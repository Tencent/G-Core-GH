# @package _global_
_target_: gpatch_v4.configs.config.RlConfig

# Qwen3-30B-A3B-Base | VESPO | sglang rollout + mcore training | DAPO-Math-17k
# N = rollout_gbs * sampling_keep_n / train_gbs = 256 * 8 / 256 = 8.
# VESPO uses use_legacy_loss=False; dyn-CP reconstructs to response-padded
# [B, R_max] before loss (same path as GRPO/SAPO).

placement_type: "colocate"

training:
  training_backend: mcore
  use_gen_rm_reward: False
  use_bt_rm_reward: True
  use_fast_tokenizer: True
  rollout_gbs: 256
  rollout_mbs: 1
  sampling_repeat_n: 8
  sampling_keep_n: 8
  train_gbs: 256
  train_mbs: 1
  data_parallel_random_init: False
  save_interval: 1000
  eval_interval: 5
  eval_before_train: False
  build_from_mbridge: True
  num_train_epoches: 1
  ppo_max_epochs_2: 1
  seq_length: 10240
  attention_backend: flash
  metrics_report:
    - "acc_reward"
    - "fmt_reward"
    - "overlong_penalty"
  eval_rollout_gbs: 128
  eval_sampling_repeat_n: 4
  eval_rollout_mbs: 1

checkpoint:
  load_ckpt_path: ckpt_qwen3_30b_a3b_vespo_dyn_cp
  save_ckpt_path: ckpt_qwen3_30b_a3b_vespo_dyn_cp
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 1.0e-6
  lr_warmup_steps: 0
  lr_decay_style: "constant"
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "hf-hub/zhuzilin/dapo-math-17k"
  eval_data_pathes:
    - "hf-hub/aime-2024_bigger/"
  py_path: "tasks/math_rl_v4/dapo_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  system_prompt: "Please reason step by step, keep your reasoning as short as possible, overlong response will be penalized, and put your final answer within \\boxed{}."
  dataloader_num_workers: 1
  dataloader_pin_memory: True

policy:
  dist_config:
    nnodes: -1
    tensor_model_parallel_size: 2
    expert_model_parallel_size: 8
    pipeline_model_parallel_size: 2
    expert_tensor_parallel_size: 1
    context_parallel_size: 1
    dynamic_context_parallel: True
    max_seqlen_per_dp_cp_rank: 4096
    max_seqlen_per_dp_cp_rank_fwd_only: 32768
    min_dynamic_context_parallel_size: 1
  model_arch: "qwen3_moe"
  hf_model_path: "hf-hub/Qwen/Qwen3-30B-A3B-Base"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen3-30B-A3B-Base"
  ref_hf_model_path: "hf-hub/Qwen/Qwen3-30B-A3B-Base"
  sampler_client:
    rpc_type: ray
    update_weight_max_size_mb: 512
  gen_rm_client:
    rpc_type: ray
  bt_rm_client:
    rpc_type: ray
  override_transformer_config:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1
    calculate_per_token_loss: true
    linear_cp_comm_type: fla

sampler:
  backend: sglang
  dist_config:
    nnodes: -1
  model_info:
    - model_arch: "qwen3_moe"
      hf_model_path: "hf-hub/Qwen/Qwen3-30B-A3B-Base"
  infer_engine_configs:
    - dist_config:
        nnodes: -1
        tensor_model_parallel_size: 8
      use_fast_tokenizer: True
      gpu_memory_utilization: 0.7
      max_running_requests: 64
      temperature: 1.0
      top_p: 0.9
      generate_max_tokens: 8192

bt_rm:
  dist_config:
    nnodes: -1
  reward_type: "rule_only"
  reward_model_info:
    - model_arch: "qwen3_moe"
      hf_model_path: "hf-hub/Qwen/Qwen3-30B-A3B-Base"
      reward_py_path: tasks/math_rl_v4/bt_reward_sapo.py
      parse_reward_fn_name: acc_only_rule_reward
      reward_weight: 1.0
  infer_engine_configs:
    - dist_config:
        nnodes: -1

ppo:
  advantage_type: "grpo"
  loss_func: vespo
  use_legacy_loss: False
  vespo_c1_pos: 2.0
  vespo_c2_pos: 3.0
  vespo_c1_neg: 3.0
  vespo_c2_neg: 2.0
  ppo_logps_ratio_clamp: 20
  grpo_advantage_epsilon: 1.0e-4
  grpo_kl_loss_beta: 0
  ppo_entropy_bonus: 0
  ppo_initial_policy_kl_penalty: 0

debug:
  debug_engine_update_weight: false
