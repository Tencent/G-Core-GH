# @package _global_
# GRPO with async rollout and disaggregated placement.
#
# GPU layout (16 GPU = 2 physical nodes, num_gpus_per_node=8):
#   policy:  1 node  = 8 GPU  (tp=2, pp=2, dp=2)
#   sampler: 1 node  = 8 GPU  (tp=4, 2 engines)
#   gen_rm:  1 node  = 8 GPU  (tp=4, 2 engines)
#   bt_rm:   0 nodes = 0 GPU  (rule_only, CPU-only actors)
#   Total:   (1+1+1+0) × 8 = 24 GPU = 3 nodes

placement_type: disaggregated

training:
  training_backend: mcore
  use_gen_rm_reward: False
  use_bt_rm_reward: False
  use_external_reward: True
  use_fast_tokenizer: True
  rollout_gbs: 256
  rollout_mbs: 1
  sampling_repeat_n: 16
  sampling_keep_n: 16
  train_gbs: 256
  pad_to_mulitiple_of: 1024
  train_mbs: 1
  data_parallel_random_init: False
  save_interval: 100
  build_from_mbridge: True
  num_train_epoches: 2
  ppo_max_epochs_2: 2
  single_controller: True
  async_rollout: True
  rollout_max_staleness: 1
  seq_length: 4096
  metrics_report:
    - "acc_reward"
    - "fmt_reward"
  apply_deterministic_mode: True

checkpoint:
  load_ckpt_path: save_qwen_2_5_1_5b_grpo_vllm_async_rollout
  save_ckpt_path: save_qwen_2_5_1_5b_grpo_vllm_async_rollout
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 5.0e-7
  lr_warmup_steps: 2
  lr_decay_style: "cosine"
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "hf-hub/openai/gsm8k-jsonl/train"
  py_path: "tasks/math_rl_v4/simple_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  system_prompt: "Please reason step by step, keep your reasoning as short as possible, and put your final answer within \\boxed{}."
  dataloader_num_workers: 1
  dataloader_pin_memory: True

policy:
  dist_config:
    nnodes: 2
    tensor_model_parallel_size: 4
    expert_model_parallel_size: 4
    pipeline_model_parallel_size: 4
    expert_tensor_parallel_size: 1
  model_arch: "qwen3_moe"
  hf_model_path: "hf-hub/Qwen/Qwen3-30B-A3B"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen3-30B-A3B"
  ref_hf_model_path: "hf-hub/Qwen/Qwen3-30B-A3B"
  sampler_client:
    rpc_type: ray
  gen_rm_client:
    rpc_type: ray
  bt_rm_client:
    rpc_type: ray
  balance_dp_seqlen: True
  smart_pad_infer: True
  smart_pad_train: True
  dynamic_mbs_target_seqlen_fwd_only: 8192
  dynamic_mbs_limit_fwd_only: 16
  dynamic_mbs_target_seqlen: 4096
  dynamic_mbs_limit: 16
  override_transformer_config:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1

sampler:
  dist_config:
    nnodes: 2
  backend: vllm
  model_info:
    - model_arch: "qwen3_moe"
      hf_model_path: "hf-hub/Qwen/Qwen3-30B-A3B"

  infer_engine_configs:
    - dist_config:
        tensor_model_parallel_size: 8
        nnodes: 2
      use_fast_tokenizer: True
      gpu_memory_utilization: 0.7
      max_running_requests: 128
      temperature: 1.0
      top_p: 0.9
      generate_max_tokens: 1024

bt_rm:
  dist_config:
    nnodes: 0
  reward_type: "rule_only"
  reward_model_info:
    - model_arch: "qwen3_moe"
      hf_model_path: "hf-hub/Qwen/Qwen3-30B-A3B"
      reward_py_path: tasks/math_rl_v4/bt_reward.py
      parse_reward_fn_name: math_rl_rule_reward
      reward_weight: 1.0
  infer_engine_configs:
    - dist_config:
        tensor_model_parallel_size: 1
        nnodes: 0
        num_cpu_nodes: 1

gen_rm:
  dist_config:
    nnodes: 0
  reward_model_info:
    - model_arch: "qwen2"
      hf_model_path: "sft_convert/hf/3357/"
      reward_py_path: tasks/math_rl_v4/gen_rm_reward.py
      gen_reward_fn_name: generate_rewards
      reward_weight: 1.0
  infer_engine_configs:
    - dist_config:
        tensor_model_parallel_size: 4
        nnodes: 0

external_reward:
  reward_info:
    - reward_py_path: tasks/math_rl_v4/math_external_reward.py
      reward_cls_name: MathRuleExternalReward
      reward_weight: 1.0

ppo:
  grpo_advantage_epsilon: 1.0e-4
  ppo_ratio_eps: 0.2

debug:
  save_first_rollout_data: True
  debug_engine_update_weight: False
