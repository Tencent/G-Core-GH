# @package _global_
_target_: gpatch_v4.configs.config.RlConfig

# Qwen3-8B-Base-Base (dense) | VESPO | sglang rollout + mcore training | DAPO-Math-17k
# 论文 arXiv:2602.10693，与 rl_qwen3_4b_sapo.yaml 共用 batch / 数据 / reward 配置以便 A/B。
#   - 陈旧比率 N = rollout_gbs * sampling_keep_n / train_gbs = 256*8/256 = 8，
#     对应论文主实验设置（表 1）。改 train_gbs 即可扫 N ∈ {4,16,32,64}。
#   - VESPO 只在新 loss 路径上实现，必须 use_legacy_loss=False。
#   - 无裁剪超参：核用 (c1,c2) 软抑制替代 clip，ppo_ratio_eps 不生效。
#   - 启动：照 tasks/math_rl_v4/scripts/sapo.sh，把 --config-name 换成本文件。

placement_type: "colocate"

training:
  training_backend: mcore
  use_gen_rm_reward: False
  use_bt_rm_reward: True
  use_fast_tokenizer: True
  rollout_gbs: 256
  rollout_mbs: 1
  sampling_repeat_n: 8
  sampling_keep_n: 8
  train_gbs: 256
  train_mbs: 1
  data_parallel_random_init: False
  save_interval: 100
  eval_interval: 10
  eval_before_train: True
  build_from_mbridge: True
  num_train_epoches: 1
  ppo_max_epochs_2: 1
  seq_length: 10240
  metrics_report:
    - "acc_reward"
    - "fmt_reward"
    - "overlong_penalty"
  eval_rollout_gbs: 128
  eval_rollout_mbs: 1

checkpoint:
  load_ckpt_path: ckpt_qwen3_8b_vespo
  save_ckpt_path: ckpt_qwen3_8b_vespo
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 1.0e-6
  lr_warmup_steps: 0
  lr_decay_style: "constant"
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "hf-hub/zhuzilin/dapo-math-17k"
  eval_data_pathes:
    - "hf-hub/aime-2024_bigger/"
  py_path: "tasks/math_rl_v4/dapo_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  system_prompt: "Please reason step by step, keep your reasoning as short as possible, overlong response will be penalized, and put your final answer within \\boxed{}."
  dataloader_num_workers: 1
  dataloader_pin_memory: True

policy:
  dist_config:
    nnodes: -1
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
  model_arch: "qwen3"
  hf_model_path: "hf-hub/Qwen/Qwen3-8B-Base"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen3-8B-Base"
  ref_hf_model_path: "hf-hub/Qwen/Qwen3-8B-Base"
  sampler_client:
    rpc_type: ray
    update_weight_max_size_mb: 512
  gen_rm_client:
    rpc_type: ray
  bt_rm_client:
    rpc_type: ray
  balance_dp_seqlen: True
  smart_pad_infer: True
  smart_pad_train: True

sampler:
  backend: sglang
  dist_config:
    nnodes: -1
  model_info:
    - model_arch: "qwen3"
      hf_model_path: "hf-hub/Qwen/Qwen3-8B-Base"
  infer_engine_configs:
    - dist_config:
        nnodes: -1
        tensor_model_parallel_size: 2
      use_fast_tokenizer: True
      gpu_memory_utilization: 0.7
      max_running_requests: 128
      temperature: 1.0
      top_p: 1.0
      generate_max_tokens: 8192

bt_rm:
  dist_config:
    nnodes: -1
  reward_type: "rule_only"
  reward_model_info:
    - model_arch: "qwen3"
      hf_model_path: "hf-hub/Qwen/Qwen3-8B-Base"
      reward_py_path: tasks/math_rl_v4/bt_reward_sapo.py
      parse_reward_fn_name: acc_only_rule_reward
      reward_weight: 1.0
  infer_engine_configs:
    - dist_config:
        nnodes: -1

ppo:
  advantage_type: "grpo"
  loss_func: vespo
  use_legacy_loss: False
  vespo_c1_pos: 2.0
  vespo_c2_pos: 3.0
  vespo_c1_neg: 3.0
  vespo_c2_neg: 2.0
  # VESPO 把训推不一致折进 W 交给核统一处理（论文 §4.6），所以
  # enable_off_policy_correction 必须保持 False，否则会重复计一次；
  # 同时 rollout_log_probs 变成必需项。
  # VESPO 必填：既截 per-token log-ratio，也截序列级 log W。设 20 与上游
  # recipe 的两处硬编码 ±20 完全一致；留空会在 loss 里 -None 报错。
  # 不要往小了调——它会把 W 硬截断，架空核的软抑制。
  ppo_logps_ratio_clamp: 20
  grpo_advantage_epsilon: 1.0e-4
  grpo_kl_loss_beta: 0
  ppo_entropy_bonus: 0
  ppo_initial_policy_kl_penalty: 0

debug:
  debug_engine_update_weight: false
