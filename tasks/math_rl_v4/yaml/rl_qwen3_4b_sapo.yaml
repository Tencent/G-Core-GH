# @package _global_
_target_: gpatch_v4.configs.config.RlConfig

# Qwen3-8B-Base-Base (dense) | SAPO | sglang rollout + mcore training | DAPO-Math-17k
# 对齐 verl examples/sapo_trainer/run_qwen3_8b_fsdp.sh：
#   - batch：train_batch_size=256 prompts × rollout.n=16 = 4096 样本，
#     ppo_mini_batch_size=64 prompts × 16 = 1024/step -> 每 rollout 4 个 off-policy step。
#   - 序列：prompt 2048 + response 8192 = seq_length 10240，generate_max_tokens 8192。
#   - 超参：lr 1e-6 constant / weight_decay 0.01 / 关 KL / 关 entropy。
#   - reward：acc + DAPO overlong 惩罚（fmt 仅监控，不进 reward）。
#     overlong 的 buffer/factor 在 bt_reward_sapo.py 顶部常量调，max_response_len
#     取自 sampler.generate_max_tokens；设 OVERLONG_PENALTY_FACTOR=0.0 可关闭。

placement_type: "colocate"

training:
  training_backend: mcore
  use_gen_rm_reward: False
  use_bt_rm_reward: True
  use_fast_tokenizer: True
  rollout_gbs: 256
  rollout_mbs: 1
  sampling_repeat_n: 8
  sampling_keep_n: 8
  train_gbs: 256
  train_mbs: 1
  data_parallel_random_init: False
  save_interval: 100
  eval_interval: 10
  eval_before_train: True
  build_from_mbridge: True
  num_train_epoches: 1
  ppo_max_epochs_2: 1
  seq_length: 10240
  metrics_report:
    - "acc_reward"
    - "fmt_reward"
    - "overlong_penalty"
  eval_rollout_gbs: 128
  eval_rollout_mbs: 1

checkpoint:
  load_ckpt_path: ckpt_qwen3_8b_sapo
  save_ckpt_path: ckpt_qwen3_8b_sapo
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 1.0e-6
  lr_warmup_steps: 0
  lr_decay_style: "constant"
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "hf-hub/zhuzilin/dapo-math-17k"
  eval_data_pathes:
    - "hf-hub/aime-2024_bigger/"
  py_path: "tasks/math_rl_v4/dapo_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  system_prompt: "Please reason step by step, keep your reasoning as short as possible, overlong response will be penalized, and put your final answer within \\boxed{}."
  dataloader_num_workers: 1
  dataloader_pin_memory: True

policy:
  dist_config:
    nnodes: -1
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
  model_arch: "qwen3"
  hf_model_path: "hf-hub/Qwen/Qwen3-8B-Base"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen3-8B-Base"
  ref_hf_model_path: "hf-hub/Qwen/Qwen3-8B-Base"
  sampler_client:
    rpc_type: ray
    update_weight_max_size_mb: 512
  gen_rm_client:
    rpc_type: ray
  bt_rm_client:
    rpc_type: ray
  balance_dp_seqlen: True
  smart_pad_infer: True
  smart_pad_train: True

sampler:
  backend: sglang
  dist_config:
    nnodes: -1
  model_info:
    - model_arch: "qwen3"
      hf_model_path: "hf-hub/Qwen/Qwen3-8B-Base"
  infer_engine_configs:
    - dist_config:
        nnodes: -1
        tensor_model_parallel_size: 2
      use_fast_tokenizer: True
      gpu_memory_utilization: 0.7
      max_running_requests: 128
      temperature: 1.0
      top_p: 1.0
      generate_max_tokens: 8192

bt_rm:
  dist_config:
    nnodes: -1
  reward_type: "rule_only"
  reward_model_info:
    - model_arch: "qwen3"
      hf_model_path: "hf-hub/Qwen/Qwen3-8B-Base"
      reward_py_path: tasks/math_rl_v4/bt_reward_sapo.py
      parse_reward_fn_name: acc_only_rule_reward
      reward_weight: 1.0
  infer_engine_configs:
    - dist_config:
        nnodes: -1

ppo:
  advantage_type: "grpo"
  loss_func: sapo
  sapo_tau_pos: 1.0
  sapo_tau_neg: 1.05
  grpo_advantage_epsilon: 1.0e-4
  grpo_kl_loss_beta: 0
  ppo_entropy_bonus: 0
  ppo_initial_policy_kl_penalty: 0
  ppo_ratio_eps: 0.2

debug:
  debug_engine_update_weight: false
