# @package _global_
# GRPO two-turn reflection with partial-colocated placement.
#
# Logical role allocation: policy 16 GPU + sampler 8 GPU + gen-RM 8 GPU = 32 GPU.
# Physical allocation: 16 GPU on two nodes. The policy occupies all 16 GPUs;
# sampler uses policy ranks [0, 8), and gen-RM uses policy ranks [8, 16).

placement_type: partial_colocated

training:
  training_backend: mcore
  use_gen_rm_reward: True
  use_bt_rm_reward: False
  use_external_reward: False
  use_fast_tokenizer: True
  rollout_gbs: 32
  rollout_mbs: 1
  sampling_repeat_n: 16
  sampling_keep_n: 16
  train_gbs: 96
  pad_to_mulitiple_of: 1024
  train_mbs: 1
  data_parallel_random_init: False
  save_interval: 100
  build_from_mbridge: True
  num_train_epoches: 2
  ppo_max_epochs_2: 2
  single_controller: True
  async_rollout: True
  early_swap_model: True
  rollout_max_staleness: 0
  seq_length: 4096
  reflect_top_k: 1
  agent_loop_actor_cls: "gpatch_v4.rollout_generator.async_rollout.TwoTurnReflectAgentLoopActor"
  metrics_report:
    - "acc_reward"
    - "fmt_reward"

checkpoint:
  load_ckpt_path: /mnt/wfs/mmhuizhouwfssz/llmmodels/Qwen/Qwen2.5-1.5B-Instruct/
  save_ckpt_path: save_qwen_2_5_1_5b_grpo_two_turns_partial_colocated
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 5.0e-7
  lr_warmup_steps: 2
  lr_decay_style: "cosine"
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "/mnt/ceph-hz1-csp/mm-base-plt2/nrwu/hf-hub/openai/gsm8k-jsonl/train"
  py_path: "tasks/math_rl_v4/simple_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  system_prompt: "Please reason step by step, keep your reasoning as short as possible, and put your final answer within \\boxed{}."
  dataloader_num_workers: 1
  dataloader_pin_memory: True

policy:
  dist_config:
    nnodes: 2
    num_gpus_per_node: 8
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
  model_arch: "qwen2"
  hf_model_path: "/mnt/wfs/mmhuizhouwfssz/llmmodels/Qwen/Qwen2.5-1.5B-Instruct/"
  hf_tokenizer_path: "/mnt/wfs/mmhuizhouwfssz/llmmodels/Qwen/Qwen2.5-1.5B-Instruct/"
  ref_hf_model_path: "/mnt/wfs/mmhuizhouwfssz/llmmodels/Qwen/Qwen2.5-1.5B-Instruct/"
  sampler_client:
    rpc_type: ray
  gen_rm_client:
    rpc_type: ray
  bt_rm_client:
    rpc_type: ray
  balance_dp_seqlen: True
  smart_pad_infer: True
  smart_pad_train: True
  dynamic_mbs_target_seqlen_fwd_only: 8192
  dynamic_mbs_limit_fwd_only: 16
  dynamic_mbs_target_seqlen: 4096
  dynamic_mbs_limit: 16

sampler:
  dist_config:
    nnodes: 1
    num_gpus_per_node: 8
  backend: sglang
  model_info:
    - model_arch: "qwen2"
      hf_model_path: "/mnt/wfs/mmhuizhouwfssz/llmmodels/Qwen/Qwen2.5-1.5B-Instruct/"
  infer_engine_configs:
    - dist_config:
        nnodes: 1
        num_gpus_per_node: 8
        tensor_model_parallel_size: 2
      use_fast_tokenizer: True
      load_format: "dummy"
      gpu_memory_utilization: 0.7
      max_running_requests: 128
      temperature: 1.0
      top_p: 0.9
      generate_max_tokens: 1024

gen_rm:
  backend: sglang
  dist_config:
    nnodes: 1
    num_gpus_per_node: 8
  reward_model_info:
    - model_arch: "qwen3_5"
      hf_model_path: "/mnt/wfs/mmhuizhouwfssz/llmmodels/Qwen/Qwen3.5-9B/"
      reward_py_path: tasks/math_rl_v4/gen_rm_reward.py
      gen_reward_fn_name: generate_rewards
      gen_reward_repeat_n: 1
      reward_weight: 1.0
  infer_engine_configs:
    - dist_config:
        nnodes: 1
        num_gpus_per_node: 8
        tensor_model_parallel_size: 8
      use_fast_tokenizer: True
      gpu_memory_utilization: 0.7
      max_running_requests: 128
      temperature: 0.0
      top_p: 1.0
      generate_max_tokens: 512

ppo:
  grpo_advantage_epsilon: 1e-4
  ppo_ratio_eps: 0.2
  grpo_kl_loss_beta: 0
  ppo_logps_ratio_clamp: 20.0
  ppo_dual_clip_ratio_c: 10.0
  ppo_clip_ratio_low: 0.2
  ppo_clip_ratio_high: 0.2

