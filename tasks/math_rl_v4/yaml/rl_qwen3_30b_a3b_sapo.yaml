# @package _global_
_target_: gpatch_v4.configs.config.RlConfig

# Qwen3-30B-A3B | SAPO | sglang rollout + mcore training | DAPO-Math-17k
# 由原 tasks/math_rl_v4/scripts/sapo.sh 的 COMMON_OVERRIDES + SAPO 段固化而来，
# 基于 rl_qwen3_30b_moe.yaml。
#   - 正式规模：每 rollout 16×16=256 样本，切成 256/32=8 个 off-policy step。
#   - 序列：prompt + response = seq_length 10240，generate_max_tokens 8192。
#   - reward：acc + DAPO overlong 惩罚（fmt 仅监控，不进 reward）。overlong 的
#     buffer/factor 在 bt_reward_sapo.py 顶部常量调；设 OVERLONG_PENALTY_FACTOR=0.0 可关闭。
#   - 对比算法：改 ppo.loss_func 为 gspo / grpo 即可。

placement_type: "colocate"

training:
  training_backend: mcore
  use_gen_rm_reward: False
  use_bt_rm_reward: True
  use_fast_tokenizer: True
  rollout_gbs: 256
  rollout_mbs: 1
  sampling_repeat_n: 16
  sampling_keep_n: 16
  train_gbs: 512
  train_mbs: 1
  data_parallel_random_init: False
  save_interval: 10
  eval_interval: 10
  eval_before_train: False
  build_from_mbridge: True
  num_train_epoches: 1
  ppo_max_epochs_2: 1
  seq_length: 10240
  metrics_report:
    - "acc_reward"
    - "fmt_reward"
    - "overlong_penalty"

checkpoint:
  load_ckpt_path: ckpt_qwen3_30b_a3b_base_sapo
  save_ckpt_path: ckpt_qwen3_30b_a3b_base_sapo
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 1.0e-6
  lr_warmup_steps: 0
  lr_decay_style: "constant"
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "hf-hub/zhuzilin/dapo-math-17k"
  eval_data_pathes:
    - "hf-hub/zhuzilin/aime-2024"
  py_path: "tasks/math_rl_v4/simple_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  dataloader_num_workers: 1
  dataloader_pin_memory: True

policy:
  dist_config:
    nnodes: -1
    tensor_model_parallel_size: 4
    expert_model_parallel_size: 4
    pipeline_model_parallel_size: 2
    expert_tensor_parallel_size: 1
  model_arch: "qwen3_moe"
  hf_model_path: "hf-hub/Qwen/Qwen3-30B-A3B"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen3-30B-A3B"
  ref_hf_model_path: "hf-hub/Qwen/Qwen3-30B-A3B"
  sampler_client:
    rpc_type: ray
    update_weight_max_size_mb: 512
  gen_rm_client:
    rpc_type: ray
  bt_rm_client:
    rpc_type: ray
  override_transformer_config:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1

sampler:
  backend: sglang
  dist_config:
    nnodes: -1
  model_info:
    - model_arch: "qwen3_moe"
      hf_model_path: "hf-hub/Qwen/Qwen3-30B-A3B"
  infer_engine_configs:
    - dist_config:
        nnodes: -1
        tensor_model_parallel_size: 8
      use_fast_tokenizer: True
      gpu_memory_utilization: 0.8
      max_running_requests: 64
      temperature: 1.0
      top_p: 0.9
      generate_max_tokens: 8192

bt_rm:
  dist_config:
    nnodes: -1
  reward_type: "rule_only"
  reward_model_info:
    - model_arch: "qwen3_moe"
      hf_model_path: "hf-hub/Qwen/Qwen3-30B-A3B"
      reward_py_path: tasks/math_rl_v4/bt_reward_sapo.py
      parse_reward_fn_name: acc_only_rule_reward
      reward_weight: 1.0
  infer_engine_configs:
    - dist_config:
        nnodes: -1

ppo:
  advantage_type: "grpo"
  loss_func: sapo
  sapo_tau_pos: 1.0
  sapo_tau_neg: 1.05
  grpo_advantage_epsilon: 1.0e-4
  grpo_kl_loss_beta: 0
  ppo_entropy_bonus: 0
  ppo_initial_policy_kl_penalty: 0
  ppo_ratio_eps: 0.2

debug:
  debug_engine_update_weight: false
