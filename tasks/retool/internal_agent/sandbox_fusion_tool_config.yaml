tools:
  - class_name: "tasks.retool.internal_agent.retool.CustomSandboxFusionTool"
    config:
      # Prefer env var so Ray workers & vlaunch can override without editing files.
      # For single-machine debug: export SANDBOX_FUSION_URL="http://127.0.0.1:8008/run_code"
      sandbox_fusion_url: ${oc.env:SANDBOX_FUSION_URL,"http://127.0.0.1:8008/run_code"}
      num_workers: 8
      enable_global_rate_limit: true
      rate_limit: 64
      default_timeout: 20
      default_language: "python"
      memory_limit_mb: 1024
      type: native

    tool_schema:
      type: "function"
      function:
        name: "code_interpreter"
        description: "A tool for executing code."
        parameters:
          type: "object"
          properties:
            code:
              type: "string"
              description: "The code to execute."
          required: ["code"]
