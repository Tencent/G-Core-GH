# verl GRPO base aligned with the gcore RL base (Qwen3-0.6B | gsm8k | SGLang |
# Megatron). The orthogonal pieces live in config groups composed by align.yaml:
#   loss/        -> algorithm.adv_estimator + actor.policy_loss/clip + loss_agg_mode
#   model/       -> actor_rollout_ref.model (HF path + grad ckpt)
#   parallelism/ -> actor/ref megatron TP/PP/CP, rollout TP, model.use_remove_padding
#   staleness/   -> data.train_batch_size + actor.ppo_mini_batch_size/ppo_epochs +
#                   rollout.n + save/resume
#   rollout/     -> inference backend (sglang | vllm): actor_rollout_ref.rollout
#
# Paths below are repo-root-relative (mirrors the gcore base/model yaml). run.sh
# launches from the repo root with hydra.job.chdir=False, so the driver and every
# Ray worker resolve them against the shared-FS repo root. Only the wandb
# project/experiment names stay as run.sh CLI overrides.
#
# hydra.searchpath (pkg://verl.trainer.config) is injected via CLI in run.sh, not
# here, because hydra.searchpath may only be set by the primary config.
defaults:
  - ppo_megatron_trainer
  - _self_

data:
  train_files: ["tests/test_alignment_v4/common/verl/data/dapo-math-17k.parquet"]
  val_files: ["tests/test_alignment_v4/common/verl/data/aime-2024.parquet"]
  # train_files: ["tests/test_alignment_v4/common/verl/data/gsm8k/train.parquet"]
  # val_files: ["tests/test_alignment_v4/common/verl/data/gsm8k/val.parquet"]
  max_prompt_length: 2048
  max_response_length: 8192
  filter_overlong_prompts: True
  truncation: error
  # deterministic: disable dataloader shuffle so the sample order is fixed.
  shuffle: False
  # match gcore: Qwen3 chat template with thinking DISABLED.
  apply_chat_template_kwargs:
    enable_thinking: False

actor_rollout_ref:
  actor:
    optim:
      lr: 1.0e-6
      weight_decay: 0.01
      lr_warmup_steps: 0
      lr_decay_style: constant
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: False
    megatron:
      dynamic_context_parallel: False
      max_seqlen_per_dp_cp_rank: 4096
      param_offload: True
      optimizer_offload: True
      grad_offload: True
      use_mbridge: True
      override_transformer_config:
        recompute_granularity: full
        recompute_method: uniform
        recompute_num_layers: 1
        deterministic_mode: True
        attention_backend: flash

  # rollout (inference engine) settings live in the rollout/ backend group
  # (rollout/sglang). rollout.n -> staleness, rollout.tensor_model_parallel_size /
  # agent -> parallelism. verl's rollout is a dict (hydra deep-merges), so these
  # split cleanly across groups (unlike gcore's list-based sampler).

  ref:
    log_prob_use_dynamic_bsz: False
    log_prob_micro_batch_size_per_gpu: 1
    megatron:
      dynamic_context_parallel: False
      max_seqlen_per_dp_cp_rank: 4096
      param_offload: True
      use_mbridge: True
      # ref override_transformer_config inherits the actor's via verl's oc.select
      # default; do NOT re-declare it here.

reward:
  reward_manager:
    name: naive
  custom_reward_function:
    path: "tests/test_alignment_v4/common/verl/rewards/dapo_reward.py"
    # path: "tests/test_alignment_v4/common/verl/rewards/gsm8k_reward.py"
    name: compute_score

trainer:
  # single-GPU default; topology/hybrid_parallelism overrides n_gpus_per_node.
  # Multi-node runs pass trainer.nnodes=N on the CLI (the mpirun ray bootstrap
  # derives N from the hostfile).
  resume_mode: disable
  save_freq: -1
  n_gpus_per_node: 1
  nnodes: 1
  balance_batch: False
  critic_warmup: 0
  logger: ["console", "wandb"]
  val_before_train: False
  test_freq: 1000
  total_epochs: 1
