# @package _global_
# GSPO loss for legacy vs new loss repro.
# Seq-mean aggregation (calculate_per_token_loss must be False); advantage stays grpo.
ppo:
  advantage_type: "grpo"
  loss_func: gspo
  grpo_advantage_epsilon: 1.0e-6
  grpo_kl_loss_beta: 0.1
  ppo_entropy_bonus: 0.1
  ppo_initial_policy_kl_penalty: 0.1
  ppo_ratio_eps: 0.2
  ppo_clip_ratio_low: 0.003
  ppo_clip_ratio_high: 0.004
  ppo_dual_clip_ratio_c: 20
  ppo_logps_ratio_clamp: 20

policy:
  override_transformer_config:
    calculate_per_token_loss: False
