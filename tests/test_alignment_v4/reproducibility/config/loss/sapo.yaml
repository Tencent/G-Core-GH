# @package _global_
# SAPO loss for legacy vs new loss repro.
# Soft-gate temperatures match production defaults / PpoConfig; advantage stays grpo.
ppo:
  advantage_type: "grpo"
  loss_func: sapo
  grpo_advantage_epsilon: 1.0e-6
  grpo_kl_loss_beta: 0.1
  ppo_entropy_bonus: 0.1
  ppo_initial_policy_kl_penalty: 0.1
  ppo_ratio_eps: 0.2
  ppo_dual_clip_ratio_c: 20
  ppo_logps_ratio_clamp: 20
  sapo_tau_pos: 1.0
  sapo_tau_neg: 1.05

policy:
  override_transformer_config:
    calculate_per_token_loss: False
