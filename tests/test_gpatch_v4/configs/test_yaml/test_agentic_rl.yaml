# @package _global_
# Agentic smoke test: disaggregated + async rollout + EnvAgentLoopActor + traj_env_manager.

placement_type: disaggregated

training:
  training_backend: mcore
  use_gen_rm_reward: False
  use_bt_rm_reward: False
  use_fast_tokenizer: True
  rollout_gbs: 8
  rollout_mbs: 1
  sampling_repeat_n: 8
  sampling_keep_n: 8
  train_gbs: 64
  train_mbs: 1
  seq_length: 4096
  data_parallel_random_init: False
  save_interval: 100
  build_from_mbridge: True
  num_train_epoches: 1
  ppo_max_epochs_2: 1
  total_ppo_step: 1
  ppo_step_per_epoch: 1
  single_controller: True
  async_rollout: True
  rollout_max_staleness: 0
  num_agent_loop_workers: 2
  agent_loop_actor_cls: "gpatch_v4.rollout_generator.async_rollout.env_agent_loop_actor.EnvAgentLoopActor"
  agentic:
    max_concurrency: 4
    adv_estimator: grpo
    mask_negative_samples: False
    reward_normalization:
      grouping: traj_group_id
      method: mean_std
    train_env_manager:
      llm_proxy:
        proxy_type: engine
    env_cfg_template:
      env_type: test_simple_agentic
      custom_env_cls: gpatch_v4.agentic.env.simple_agentic_env:SimpleAgenticEnv
      max_steps: 3
      max_tokens_per_step: 512
      env_manager_cls: gpatch_v4.agentic.env_manager.traj_env_manager.TrajEnvManager
      agent_system_template: "You are a helpful assistant that solves math problems."
      agent_template: "{observation}"
      env_tool_config:
        use_tools: true
        tools_json_path: tasks/retool/agentic_rl/tools_code_interpreter.json
        tool_call_parser: sglang/qwen25
      env_config:
        max_steps: 3

data:
  data_pathes:
    - "tests/test_gpatch_v4/gsm8k_small"
  py_path: "tests/test_gpatch_v4/custom_py/simple_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  dataloader_num_workers: 1
  dataloader_pin_memory: True

checkpoint:
  load_ckpt_path: unittest_agentic_rl
  save_ckpt_path: unittest_agentic_rl
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 1e-6
  lr_warmup_steps: 0
  lr_decay_style: "constant"
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

policy:
  dist_config:
    nnodes: 1
    num_gpus_per_node: 4
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
  model_arch: "qwen2"
  hf_model_path: "hf-hub/Qwen/Qwen2.5-1.5B-Instruct"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen2.5-1.5B-Instruct"
  ref_hf_model_path: "hf-hub/Qwen/Qwen2.5-1.5B-Instruct"
  without_ref: False
  rollout_gen_type: agentic
  sampler_client:
    rpc_type: ray
  gen_rm_client:
    rpc_type: ray
  bt_rm_client:
    rpc_type: ray

sampler:
  dist_config:
    nnodes: 1
    num_gpus_per_node: 4
  backend: sglang
  model_info:
    - model_arch: "qwen2"
      hf_model_path: ${policy.hf_model_path}
      gen_rollout_py_path: "gpatch_v4/agentic/generate_func.py"
      gen_rollout_fn_name: "generate_func"
  infer_engine_configs:
    - dist_config:
        nnodes: 1
        num_gpus_per_node: 4
        tensor_model_parallel_size: 1
      use_fast_tokenizer: True
      gpu_memory_utilization: 0.5
      max_running_requests: 8
      temperature: 1.0
      top_p: 1.0
      generate_max_tokens: 512

gen_rm:
  dist_config:
    nnodes: 0

bt_rm:
  dist_config:
    nnodes: 0

ppo:
  grpo_advantage_epsilon: 1.0e-6
  ppo_ratio_eps: 0.2
  advantage_type: grpo
  whiten_advantages: False

debug:
  save_first_rollout_data: False
  debug_engine_update_weight: False
