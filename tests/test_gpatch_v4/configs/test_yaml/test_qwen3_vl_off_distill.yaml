# @package _global_

training:
  training_backend: mcore
  use_fast_tokenizer: True
  train_gbs: 8
  train_mbs: 1
  seq_length: 8192
  data_parallel_random_init: False
  save_interval: 500
  num_train_epoches: 10
  prefetch_num_gb: 1
  comput_attn_mask: False
  sort_batched: False
  build_from_mbridge: True
  auto_load_from_save_ckpt: True
  enable_teacher_rollout: False
  enable_teacher_kl_loss: True
  setup_teacher_in_independent_topo: False
  loss_func: ce_with_kl
  exit_step: 1

checkpoint:
  load_ckpt_path: unittest_offpd
  save_ckpt_path: unittest_offpd
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 0
  lr_warmup_steps: 0
  lr_decay_style: "constant"
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "hf-hub/wechat/geo3k_gen_16_sample"
  py_path: "tasks/multimodal_v4/off_policy_distill/qwen3vl_rbs_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  dataloader_num_workers: 4
  dataloader_pin_memory: True

policy:
  dist_config:
    nnodes: 1
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 2
    context_parallel_size: 2
  model_arch: "qwen3_vl"
  without_ref: True
  hf_model_path: "hf-hub/Qwen/Qwen3-VL-2B-Instruct"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen3-VL-2B-Instruct"
  rollout_gen_type: "off_policy_distill"
  sampler_client:
    rpc_type: ray
  teacher_client:
    rpc_type: ray

# test 用，理论上不能用相同的模型
teacher:
  model_arch: "qwen3_vl"
  hf_model_path: "hf-hub/Qwen/Qwen3-VL-2B-Instruct"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen3-VL-2B-Instruct"
  wrap_with_ddp: False


debug:
  save_first_rollout_data: True
  debug_engine_update_weight: False
  test_ray_rpc: False
  trainer_return_ppo_step_metrics: True
