# @package _global_

training:
  training_backend: mcore
  use_fast_tokenizer: True
  train_gbs: 8
  train_mbs: 1
  seq_length: 512
  data_parallel_random_init: False
  save_interval: 5000
  num_train_epoches: 1
  comput_attn_mask: False
  sort_batched: False
  skip_train_step: true
  exit_step: 10

policy:
  dist_config:
    nnodes: 1
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
  model_arch: "qwen2"
  without_ref: True
  hf_model_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"

checkpoint:
  load_ckpt_path: test_launch_retry
  save_ckpt_path: test_launch_retry
  mbridge_distributed_filesystem: True
  override_tokenizer_special_token:
    eos_token: "<|im_end|>"
# 注意，如果训练的事 base model, 那么有必要设置 override_tokenizer_special_token 的 eos_token 位置，否则保存下来的 eos_token 会很混乱

optimizer:
  lr: 2.0e-5
  lr_warmup_steps: 10
  lr_decay_style: "cosine"
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "hf-hub/AI-MO/NuminaMath-CoT-jsonl/train/"
  py_path: "tasks/math_rl_v4/finetune_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  system_prompt: "Please reason step by step, keep your reasoning as short as possible, and put your final answer within \\boxed{}."
  dataloader_num_workers: 1
  dataloader_pin_memory: True
