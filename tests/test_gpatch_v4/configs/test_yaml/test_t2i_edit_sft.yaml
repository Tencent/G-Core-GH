# @package _global_

training:
  training_backend: fsdp2
  train_mbs: 1
  train_gbs: 32
  width: 512
  height: 512
  save_interval: 2
  num_train_epoches: 1
  exit_step: 2
  recompute: True

checkpoint:
  load_ckpt_path: t2i_edit_sft_test_save
  save_ckpt_path: t2i_edit_sft_test_save
  no_save_optim: True

optimizer:
  lr: 1e-6
  lr_warmup_steps: 0
  lr_decay_style: "constant"
  weight_decay: 0.01

data:
  data_pathes:
    - "hf-hub/ma-xu/fine-t2i/synthetic_enhanced_prompt_random_resolution"
  fn_name: "tasks.t2i_edit.my_data.sr_dataset.get_dataset_and_dataloader"

policy:
  dist_config:
    nnodes: 2
  model_arch: "qwen_image_edit"
  hf_model_path: "hf-hub/Qwen/Qwen-Image-Edit-2511"
  without_ref: True
  kv_store_client:
    rpc_type: 'ray'

kv:
  dist_config:
    nnodes: 2

debug:
  save_images: True
  save_images_dir: debug_images
