# @package _global_
# Prev-entropy quantile GRPO e2e (post_compute_logprobs + print cuts + plain GRPO).
# Based on test_epo_grpo_e2e.yaml / test_math_rl_sync_fullrun.yaml.

training:
  training_backend: mcore
  use_gen_rm_reward: False
  use_bt_rm_reward: True
  use_fast_tokenizer: True
  rollout_gbs: 2
  rollout_mbs: 1
  sampling_repeat_n: 2
  sampling_keep_n: 2
  train_gbs: 4
  train_mbs: 1
  exit_step: 1
  apply_deterministic_mode: True
  data_parallel_random_init: False
  save_interval: 1
  eval_interval: 0
  eval_before_train: False
  build_from_mbridge: True
  num_train_epoches: 1
  ppo_max_epochs_2: 1
  metrics_report:
    - "acc_reward"
    - "fmt_reward"

checkpoint:
  load_ckpt_path: ""
  save_ckpt_path: save_prev_entropy_quantile_e2e
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 0
  lr_warmup_steps: 0
  lr_decay_style: "cosine"
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "tests/test_gpatch_v4/gsm8k_small"
  eval_data_pathes:
    - "hf-hub/openai/gsm8k-jsonl/eval"
  py_path: "tasks/math_rl_v4/simple_dataset.py"
  system_prompt: "Please reason step by step, keep your reasoning as short as possible, and put your final answer within \\boxed{}."
  fn_name: "get_dataset_and_dataloader"
  dataloader_num_workers: 1
  dataloader_pin_memory: True

policy:
  dist_config:
    tensor_model_parallel_size: 4
    expert_model_parallel_size: 1
    pipeline_model_parallel_size: 2
    nnodes: 1
  model_arch: "qwen2"
  hf_model_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"
  ref_hf_model_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"
  sampler_client:
    rpc_type: ray
  gen_rm_client:
    rpc_type: ray
  bt_rm_client:
    rpc_type: ray
  override_transformer_config:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1

sampler:
  backend: sglang
  model_info:
    - model_arch: "qwen2"
      hf_model_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"

  infer_engine_configs:
    - dist_config:
        tensor_model_parallel_size: 4
        nnodes: 1
      use_fast_tokenizer: True
      gpu_memory_utilization: 0.7
      max_running_requests: 128
      temperature: 1.0
      top_p: 0.9
      generate_max_tokens: 1024

bt_rm:
  reward_type: "rule_only"
  reward_model_info:
    - model_arch: "qwen2.5-math-rm-72b"
      hf_model_path: "hf-hub/Qwen/Qwen2.5-7B"
      reward_py_path: tasks/math_rl_v4/bt_reward.py
      parse_reward_fn_name: math_rl_rule_reward
      reward_weight: 1.0
  infer_engine_configs:
    - dist_config:
        tensor_model_parallel_size: 1
        nnodes: 1

ppo:
  use_legacy_loss: true
  feature_store_enable: true
  post_compute_logprobs: prev_entropy_quantile
  post_compute_logprobs_py_path: tasks/math_rl_v4/pre_entropy_quantile.py
  post_compute_logprobs_py_name: prev_entropy_quantile_postprocess
  loss_func: prev_entropy_quantile_grpo
  loss_func_py_path: tasks/math_rl_v4/pre_entropy_quantile.py
  loss_func_py_name: prev_entropy_quantile_grpo_loss_func
  advantage_type: grpo
  grpo_advantage_epsilon: 1.0e-4
  ppo_ratio_eps: 0.2
  ppo_entropy_bonus: 0.0

task:
  prev_entropy_quantile_num_bins: 10

debug:
  save_first_rollout_data: False
  debug_engine_update_weight: False
  trainer_return_ppo_step_metrics: True
