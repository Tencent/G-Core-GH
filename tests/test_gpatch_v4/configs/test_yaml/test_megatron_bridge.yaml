# @package _global_

training:
  training_backend: mcore
  use_fast_tokenizer: True
  train_gbs: 16
  train_mbs: 1
  seq_length: 2048
  data_parallel_random_init: False
  save_interval: 10
  num_train_epoches: 1
  comput_attn_mask: False
  sort_batched: False
  auto_load_from_save_ckpt: True
  build_from_mbridge: False

checkpoint:
  load_ckpt_path: test_save_mbridge3
  save_ckpt_path: test_save_mbridge3
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 0.0
  lr_warmup_steps: 2
  lr_decay_style: "cosine"
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "tests/test_gpatch_v4/test_data/sft"
  py_path: "tasks/math_rl_v4/finetune_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  system_prompt: "Please reason step by step, keep your reasoning as short as possible, and put your final answer within \\boxed{}."
  dataloader_num_workers: 1
  dataloader_pin_memory: True

policy:
  dist_config:
    nnodes: 1
    tensor_model_parallel_size: 4
    pipeline_model_parallel_size: 2
    context_parallel_size: 1
    # expert_model_parallel_size: 4
    # expert_tensor_parallel_size: 1

  model_arch: "qwen3"
  without_ref: True
  hf_model_path: "hf-hub/Qwen/Qwen3-8B/"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen3-8B/"

debug:
  save_first_rollout_data: True
