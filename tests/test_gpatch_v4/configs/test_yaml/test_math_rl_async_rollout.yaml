# @package _global_
# Async rollout: disaggregated placement with explicit async_rollout flag.
# Rolling prefetch with rollout_max_staleness=1: cold-start fires 2 batches,
# trains 1 step per sampler-weight window while 1 batch is carried across
# update_weights so the next window's collect has data ready immediately.
#
# GPU layout (16 GPU = 2 physical nodes, num_gpus_per_node=8):
#   policy:  1 node  = 8 GPU  (tp=2, pp=2, dp=2)
#   sampler: 0.5 node = 4 GPU (tp=2, 2 engines)
#   gen_rm:  0.5 node = 4 GPU (tp=2, 2 engines)
#   Total:   8 + 4 + 4 = 16 GPU

placement_type: disaggregated

training:
  training_backend: mcore
  use_gen_rm_reward: True
  use_bt_rm_reward: False
  use_fast_tokenizer: True
  rollout_gbs: 16
  rollout_mbs: 1
  sampling_repeat_n: 2
  sampling_keep_n: 2
  train_gbs: 32
  train_mbs: 1
  data_parallel_random_init: False
  save_interval: 100
  build_from_mbridge: True
  num_train_epoches: 1
  ppo_max_epochs_2: 1
  single_controller: True
  async_rollout: True
  rollout_max_staleness: 1
  metrics_report:
    - "acc_reward"
    - "fmt_reward"

checkpoint:
  load_ckpt_path: save_qwen_2_5_1_5b_grpo_async
  save_ckpt_path: save_qwen_2_5_1_5b_grpo_async
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 5.0e-7
  lr_warmup_steps: 0
  lr_decay_steps: 1
  lr_decay_style: "cosine"
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "tests/test_gpatch_v4/gsm8k_small"
  py_path: "tests/test_gpatch_v4/custom_py/simple_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  dataloader_num_workers: 1
  dataloader_pin_memory: True

policy:
  dist_config:
    tensor_model_parallel_size: 2
    expert_model_parallel_size: 1
    pipeline_model_parallel_size: 2
    nnodes: 1
  model_arch: "qwen3"
  hf_model_path: "hf-hub/Qwen/Qwen3-1.7B"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen3-1.7B"
  ref_hf_model_path: "hf-hub/Qwen/Qwen3-1.7B"
  sampler_client:
    rpc_type: ray
  gen_rm_client:
    rpc_type: ray
  bt_rm_client:
    rpc_type: ray
  override_transformer_config:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1

sampler:
  dist_config:
    nnodes: 1
    num_gpus_per_node: 4
  backend: sglang
  model_info:
    - model_arch: "qwen3"
      hf_model_path: "hf-hub/Qwen/Qwen3-1.7B"

  infer_engine_configs:
    - dist_config:
        tensor_model_parallel_size: 2
        nnodes: 1
        num_gpus_per_node: 4
      use_fast_tokenizer: True
      gpu_memory_utilization: 0.7
      max_running_requests: 128
      temperature: 1.0
      top_p: 0.9
      generate_max_tokens: 1024

bt_rm:
  dist_config:
    nnodes: 0

gen_rm:
  dist_config:
    nnodes: 1
    num_gpus_per_node: 4
  reward_model_info:
    - model_arch: "qwen3"
      hf_model_path: "hf-hub/Qwen/Qwen3-1.7B"
      reward_py_path: tasks/math_rl_v4/gen_rm_reward.py
      gen_reward_fn_name: generate_rewards
      reward_weight: 1.0
  infer_engine_configs:
    - dist_config:
        tensor_model_parallel_size: 2
        nnodes: 1
        num_gpus_per_node: 4

ppo:
  grpo_advantage_epsilon: 1.0e-4
  ppo_ratio_eps: 0.2

debug:
  save_first_rollout_data: True
  debug_engine_update_weight: False
  trainer_return_ppo_step_metrics: True
