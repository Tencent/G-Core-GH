# @package _global_

training:
  training_backend: mcore
  use_gen_rm_reward: False
  use_bt_rm_reward: True
  use_fast_tokenizer: True
  total_training_step: 100
  rollout_gbs: 8
  rollout_mbs: 1
  train_mbs: 1
  train_gbs: 8
  sampling_repeat_n: 8
  data_parallel_random_init: False
  save_interval: 100

checkpoint:
  load_ckpt_path: test_ckpt_tmp
  save_ckpt_path: test_ckpt_tmp
  no_load_optim: True
  no_save_optim: True

optimizer:
  lr: 5.0e-7
  lr_warmup_steps: 10
  lr_decay_style: "constant"
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "hf-hub/openai/gsm8k-jsonl/train"
  py_path: "tasks/on_policy_distill/simple_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  dataloader_num_workers: 1
  dataloader_pin_memory: True

policy:
  dist_config:
    nnodes: 1
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 2
  model_arch: "qwen2"
  hf_model_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"
  ref_hf_model_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"
  rollout_gen_type: "on_policy_distill"
  sampler_client:
    rpc_type: ray
  teacher_client:
    rpc_type: ray
  gen_rm_client:
    rpc_type: ray
  bt_rm_client:
    rpc_type: ray

sampler:
  backend: sglang
  dist_config:
    nnodes: 1
  model_info:
    - model_arch: "qwen2"
      hf_model_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"

  infer_engine_configs:
    - dist_config:
        nnodes: 1
        tensor_model_parallel_size: 2
      gpu_memory_utilization: 0.7
      max_running_requests: 128
      temperature: 1.0
      top_p: 0.9
      generate_max_tokens: 512
      use_fast_tokenizer: True

teacher:
  dist_config:
    nnodes: 1
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
  model_arch: "qwen2"
  hf_model_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"

bt_rm:
  dist_config:
    nnodes: 1
  reward_type: "rule_only"
  reward_model_info:
    - model_arch: "qwen2"
      hf_model_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"
      reward_py_path: tasks/on_policy_distill/bt_reward.py
      parse_reward_fn_name: math_rl_rule_reward
      reward_weight: 1.0
  infer_engine_configs:
    - dist_config:
        nnodes: 1

ppo:
  advantage_type: "on_policy_distill"
  distill_kl_penalty_coef: 1.0
  distill_kl_discount_factor: 0.0
  grpo_advantage_epsilon: 1.0e-8
  ppo_ratio_eps: 1.0e-4
  grpo_kl_loss_beta: 0

debug:
  save_first_rollout_data: True
  debug_engine_update_weight: False
