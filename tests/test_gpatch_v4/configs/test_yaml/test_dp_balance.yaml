# @package _global_

training:
  training_backend: mcore
  use_gen_rm_reward: False
  use_bt_rm_reward: False
  use_fast_tokenizer: True
  rollout_gbs: 16
  rollout_mbs: 1
  sampling_repeat_n: 4
  sampling_keep_n: 4
  train_gbs: 64
  train_mbs: 1
  data_parallel_random_init: False
  save_interval: 999999
  build_from_mbridge: True
  num_train_epoches: 1
  ppo_max_epochs_2: 1
  seq_length: 4096
  pad_to_mulitiple_of: 1024

checkpoint:
  load_ckpt_path: unittest_dp_balance
  save_ckpt_path: unittest_dp_balance
  convert_mcore_to_hf_online: True
  mbridge_distributed_filesystem: True

optimizer:
  lr: 0.0
  lr_warmup_steps: 0
  lr_decay_style: "constant"
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  data_pathes:
    - "./hf-hub/DaertML/gsm8k-jsonl/"
  py_path: "tests/test_gpatch_v4/custom_py/simple_dataset.py"
  fn_name: "get_dataset_and_dataloader"
  dataloader_num_workers: 1
  dataloader_pin_memory: True

policy:
  dist_config:
    nnodes: 1
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
  model_arch: "qwen2"
  hf_model_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"
  hf_tokenizer_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"
  ref_hf_model_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"
  without_ref: False
  balance_dp_seqlen: True
  smart_pad_infer: False
  smart_pad_train: False

# sampler / bt_rm / gen_rm not needed for this test
sampler:
  backend: sglang
  model_info:
    - model_arch: "qwen2"
      hf_model_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"
  infer_engine_configs:
    - dist_config:
        nnodes: 1
        tensor_model_parallel_size: 2
      use_fast_tokenizer: True
      gpu_memory_utilization: 0.7
      max_running_requests: 4
      temperature: 1.0
      top_p: 0.9
      generate_max_tokens: 512

bt_rm:
  reward_type: "rule_only"
  reward_model_info:
    - model_arch: "qwen2.5-math-rm-72b"
      hf_model_path: "hf-hub/Qwen/Qwen2.5-Math-1.5B"
      reward_py_path: tasks/math_rl_v4/bt_reward.py
      parse_reward_fn_name: math_rl_rule_reward
      reward_weight: 1.0
  infer_engine_configs:
    - dist_config:
        tensor_model_parallel_size: 8
        nnodes: 1

ppo:
  grpo_advantage_epsilon: 1.0e-4
  ppo_ratio_eps: 0.2
  advantage_type: grpo

debug:
  save_first_rollout_data: False
  debug_engine_update_weight: False
  trainer_return_ppo_step_metrics: True
