# @package _global_

training:
  training_backend: fsdp2
  use_gen_rm_reward: False
  use_bt_rm_reward: True
  rollout_gbs: 16
  rollout_mbs: 1
  train_gbs_wo_timestep: 32
  train_mbs: 1
  sampling_repeat_n: 2
  init_same_noise: True
  guidance_scale: 3.5
  width: 512
  height: 512
  eta: 0.3
  sampling_steps: 3
  shift: 3
  data_parallel_random_init: True
  timestep_fraction: 1.0
  save_interval: 100
  num_train_epoches: 1

checkpoint:
  load_ckpt_path: t2i_grpo_test_save
  no_save_optim: True

optimizer:
  lr: 1e-5
  lr_warmup_steps: 0
  lr_decay_style: "constant_with_warmup"
  weight_decay: 0.0001

data:
  data_pathes:
    - "tasks/t2i_grpo_tv4/prompts_for_test.txt"
  py_path: "tasks/t2i_grpo_tv4/simple_dataset.py"
  fn_name: "get_dataset_and_dataloader"

policy:
  dist_config:
    nnodes: 1
  without_ref: true
  model_arch: "flux"
  hf_model_path: "hf-hub/black-forest-labs/FLUX.1-dev"
  ref_hf_model_path: "hf-hub/black-forest-labs/FLUX.1-dev"
  gen_rm_client:
    rpc_type: ray
  bt_rm_client:
    rpc_type: ray

gen_rm:
  backend: sglang
  dist_config:
    nnodes: 2
  reward_model_info:
    - model_arch: "qwen2_5_vl"
      hf_model_path: "hf-hub/Qwen/Qwen2.5-VL-7B-Instruct"
      reward_py_path: tasks/t2i_grpo_tv4/reward_file.py
      prompt_fn_name: get_qwen2_5_vl_prompt
      parse_reward_fn_name: calculate_qwen2_5_vl_rewards
      reward_weight: 1.0

  infer_engine_configs:
    - dist_config:
        nnodes: 2
        tensor_model_parallel_size: 4
      use_fast_tokenizer: True
      gpu_memory_utilization: 0.7
      max_running_requests: 128
      temperature: 1.0
      top_p: 0.9
      generate_max_tokens: 1024

bt_rm:
  dist_config:
    nnodes: 2
  reward_model_info:
    - model_arch: "hpsv2"
      hf_model_path: hf-hub/laion/CLIP-ViT-H-14-laion2B-s32B-b79K/open_clip_pytorch_model.bin
      model_weight_path: hf-hub/xswu/HPSv2/HPS_v2.1_compressed.pt
      reward_weight: 1.0
      reward_py_path: tasks/t2i_grpo_tv4/bt_rewards.py
      rm_cls_name: Hpsv2RewardModel
  infer_engine_configs:
    - dist_config:
        nnodes: 2

ppo:
  grpo_advantage_epsilon: 1.0e-8
  ppo_ratio_eps: 1.0e-4
  adv_clip_max: 5.0
  adv_clip_min: -5.0

debug:
  save_images: True
  save_images_dir: debug_images

task:
  trick1: 'a long string'
  flag2: True
  attr3: 2
  attr4: 2.0
